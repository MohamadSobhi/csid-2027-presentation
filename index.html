<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>CSID 2027 Presentation</title><link rel="stylesheet" href="css/presentation.css"></head><body>
<main id="stage" aria-label="Presentation"><div id="canvas"><img id="slide" alt=""><div id="overlays"></div></div></main>
<nav id="controls" aria-label="Presentation controls"><button data-action="previous" aria-label="Previous slide">‹</button><span id="counter" aria-live="polite"></span><button data-action="next" aria-label="Next slide">›</button><button data-action="overview">Overview</button><button data-action="fullscreen">Fullscreen</button></nav>
<dialog id="overview" aria-label="Slide overview"><button id="close-overview">Close overview</button><div id="grid"></div></dialog>
<p id="status" role="status">Loading presentation…</p><script src="js/presentation.js" defer></script></body></html>
